server {
  listen 8080;
  client_max_body_size 100m;
  include /etc/nginx/desk-api.conf;
  location / { proxy_pass http://cas:8080; }
}
server {
  listen 3000;
  client_max_body_size 100m;
  root /usr/share/nginx/html/accounts;
  include /etc/nginx/desk-api.conf;
  location / { try_files $uri $uri/ /index.html; }
}
